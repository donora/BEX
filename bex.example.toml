# BEX configuration. Copy to `bex.toml` (gitignored) and edit.
# All relative paths resolve against the directory containing the config file.

[paths]
# Cold tier: raw audio. Often a symlink to an external drive — see PLAN.md §2.
# The default points at the shared BirdSets SNE layout (../data/audio -> USB).
audio_dir = "../data/audio"
# Labelled-data manifests (annotations.csv, species.csv) for the SNE test rig.
labels_dir = "../data"
# Hot tier, on the SSD: score matrices, detections index, run manifests.
store_dir = "store"
# Hot tier: display spectrograms, cached Xeno-Canto examples.
cache_dir = "cache"
# Plausibility profiles (PLAN.md §3c). In-repo ones live here; add your own.
profiles_dir = "profiles"
# Named threshold sets saved from the app's Thresholds tab (one JSON file each).
thresholds_dir = "thresholds"

[site]
# Default site metadata for ingests that don't specify their own.
name = "sierra-nevada"
lat = 38.49
lon = -119.95

[defaults]
profile = "uk-starter"

# Optional, under [defaults] above:
#   dataset = "my-site"            the dataset the app first opens on
#   threshold_set = "my-set"       the saved threshold set it opens with
#   species_first = ["Turdus merula", "Erithacus rubecula"]
#                                  the species that take the first colours, in order

# [display]                        the app's spectrogram, for sounds outside birdsong's range
# fmin = 150                       also: fmax, n_fft, hop_length, n_mels
#
# [terms]                          the app's words, for projects on other animals
# birdsong = "frog call"           also: bird, birds, songs, "Unknown bird", "When a bird is singing"

# [extensions]                     a project's own panel on the Explorer and Label pages
# panel = "extensions/my_panel.py" see bex/extensions.py

[xeno_canto]
# links = false                    turn off species links, for animals it does not cover
# Free per-user key from xeno-canto.org (needed only for cached example audio;
# plain link-outs work without it). Never commit a real key.
api_key = ""
