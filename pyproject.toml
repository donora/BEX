[project]
name = "bex-bioacoustics"
version = "1.0.0"
description = "BEX, the Bioacoustics Explorer: benchmark bioacoustic ID models on your own recordings, with the geographic filter made visible"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mara Donora", email = "mara.donora@gmail.com" }]
keywords = ["bioacoustics", "birdnet", "perch", "bird song", "ecology",
            "benchmark", "passive acoustic monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# The app's dependencies are core: `pip install bex-bioacoustics` gives the whole
# thing. The model runner envs (envs/birdnet, envs/perch) install this package
# with --no-deps, so none of this reaches them — see PLAN.md §3b. Never add
# TensorFlow/JAX/torch here.
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "audioread>=3.0",
    # 1.63: session-persistent widgets, st.context.theme, the top navigation.
    "streamlit>=1.63",
    "matplotlib>=3.8",
    "altair>=5.0",
    # Required: clicking the spectrogram is the only way to choose the inspected
    # instant (V1 E3 removed the window slider).
    "streamlit-image-coordinates>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/donora/bex"
Source = "https://github.com/donora/bex"
Issues = "https://github.com/donora/bex/issues"

[project.scripts]
bex = "bex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bex"]

# The app and the files BEX ships with live at the repo root in a clone; the
# wheel carries them inside the package. The app keeps its own layout
# (app.py beside ui/ and assets/), so its page paths work unchanged.
[tool.hatch.build.targets.wheel.force-include]
"app.py" = "bex/webapp/app.py"
"ui" = "bex/webapp/ui"
"assets" = "bex/webapp/assets"
"profiles" = "bex/data/profiles"
"bex.example.toml" = "bex/data/bex.example.toml"

[tool.hatch.build.targets.sdist]
include = ["bex", "ui", "app.py", "assets", "profiles", "bex.example.toml",
           "envs", "scripts", "tests", "README.md", "LICENSE", "PLAN.md", "V1.md",
           ".streamlit/config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
